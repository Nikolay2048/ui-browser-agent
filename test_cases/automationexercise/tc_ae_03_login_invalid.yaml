id: tc_ae_03
name: "Вход с неверными учётными данными"
description: >
  Попытка войти с неверным паролем должна показать чёткое сообщение об ошибке
  и не предоставлять доступ в систему.
start_url: "https://automationexercise.com/login"
severity: high
tags: [авторизация, вход, негативный, обработка-ошибок, automationexercise]

steps:
  - step: "Убедиться, что форма Login видна на странице"
    expected: "Форма входа с полями Email и Password отображается"

  - step: "Ввести корректный email 'testuser_auto123@test.com' и неверный пароль 'WrongPassword999', затем нажать Login"
    expected: "Попытка входа не удалась — страница не переходит на главную"

  - step: "Проверить, что рядом с формой входа появилось сообщение об ошибке"
    expected: "Красный текст ошибки «Your email or password is incorrect!» виден на странице"

  - step: "Убедиться, что в шапке НЕ отображается «Logged in as» — пользователь остаётся гостем"
    expected: "Верхняя навигация по-прежнему показывает ссылку «Signup / Login», без текста «Logged in as»"
