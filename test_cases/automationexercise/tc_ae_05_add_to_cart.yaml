id: tc_ae_05
name: "Добавление товара в корзину с подтверждением"
description: >
  Посетитель может добавить товар в корзину со страницы Products, подтвердить
  всплывающее окно, перейти в корзину и увидеть верный товар и итог.
start_url: "https://automationexercise.com/products"
severity: critical
tags: [корзина, товары, smoke, automationexercise]

steps:
  - step: "Убедиться, что страница ALL PRODUCTS загружена и карточки товаров видны"
    expected: "Сетка товаров отображается с хотя бы одной карточкой"

  - step: "Навести курсор на первый товар (Blue Top) и нажать кнопку «Add to cart»"
    expected: "Появляется модальное окно с подтверждением добавления товара в корзину"

  - step: "Проверить, что в модальном окне отображается «Your product has been added to cart!» с кнопками «View Cart» и «Continue Shopping»"
    expected: "Модальное окно видно с обеими кнопками"

  - step: "Нажать кнопку «View Cart» в модальном окне"
    expected: "Пользователь переходит на страницу корзины /view_cart"

  - step: "Убедиться, что «Blue Top» в корзине в количестве 1 штуки за Rs. 500"
    expected: "Таблица корзины показывает «Blue Top», количество 1, цена Rs. 500, итого Rs. 500"
