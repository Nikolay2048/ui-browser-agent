id: tc_ae_11
name: "Полный цикл покупки — от поиска до подтверждения заказа"
description: >
  Сквозной сценарий: вход → поиск товара → добавление в корзину → оформление заказа
  с заполнением адреса доставки и платёжных данных → подтверждение заказа.
start_url: "https://automationexercise.com/login"
severity: critical
tags: [e2e, оформление-заказа, оплата, критический-путь, automationexercise]

steps:
  - step: "Войти с email 'testuser_auto123@test.com' и паролем 'Test@1234', нажать Login"
    expected: "В шапке сайта отображается «Logged in as TestUser»"

  - step: "Перейти в раздел Products через навигационное меню"
    expected: "Открывается страница ALL PRODUCTS с сеткой товаров"

  - step: "Найти товар «Blue Top» через поиск: ввести «Blue Top» в поле поиска и нажать Search"
    expected: "Отображаются результаты поиска с заголовком «SEARCHED PRODUCTS» и карточкой «Blue Top»"

  - step: "Навести курсор на «Blue Top» и нажать «Add to cart»"
    expected: "Появляется модальное окно с подтверждением добавления товара в корзину"

  - step: "В модальном окне нажать «Continue Shopping», затем навести курсор на второй товар и добавить его в корзину"
    expected: "Второй товар добавлен, в счётчике корзины в шапке показывается 2"

  - step: "Нажать иконку корзины в шапке для перехода в корзину"
    expected: "Открывается страница корзины /view_cart с двумя добавленными товарами"

  - step: "Нажать кнопку «Proceed To Checkout»"
    expected: "Открывается страница оформления заказа с секциями адреса доставки и сводки заказа"

  - step: "Убедиться, что адрес доставки предзаполнен данными аккаунта — имя «Test User» и страна «United States»"
    expected: "Секция адреса доставки содержит имя и страну пользователя"

  - step: "Просмотреть сводку заказа и убедиться, что оба товара присутствуют с указанными ценами"
    expected: "В сводке видны оба товара, и итоговая сумма ненулевая"

  - step: "В поле «Order comment» ввести «Автоматический тест — пожалуйста, игнорируйте»"
    expected: "Поле комментария к заказу содержит введённый текст"

  - step: "Нажать кнопку «Place Order»"
    expected: "Открывается страница ввода платёжных данных с полями карты"

  - step: "Заполнить платёжные данные: Name on Card — «Test User», Card Number — «4111111111111111», CVC — «123», Expiry Month — «12», Expiry Year — «2027»"
    expected: "Все поля платёжной формы заполнены"

  - step: "Нажать кнопку «Pay and Confirm Order»"
    expected: "Заказ подтверждён: страница содержит текст «Congratulations! Your order has been confirmed!» или «Order Placed!»"
