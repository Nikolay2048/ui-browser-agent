id: tc_ae_09
name: "Подписка на рассылку через футер"
description: >
  Ввод корректного email в поле подписки в футере и его отправка
  должны показать сообщение об успешной подписке.
start_url: "https://automationexercise.com/"
severity: low
tags: [подписка, рассылка, футер, automationexercise]

steps:
  - step: "Убедиться, что главная страница загружена, прокрутить вниз до футера"
    expected: "Секция футера видна с заголовком «SUBSCRIPTION»"

  - step: "Ввести «newsletter_test@example.com» в поле email для подписки"
    expected: "Поле ввода подписки содержит указанный email"

  - step: "Нажать кнопку-стрелку (отправить) рядом с полем email подписки"
    expected: "Запрос на подписку отправлен"

  - step: "Проверить, что под формой подписки появилось сообщение об успехе"
    expected: "Зелёное сообщение «You have been successfully subscribed!» отображается под формой"
