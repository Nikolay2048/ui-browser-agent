id: tc_ae_07
name: "Навигация по категориям — Женщины > Tops"
description: >
  Боковая панель категорий должна фильтровать товары и показывать только
  позиции из выбранной подкатегории.
start_url: "https://automationexercise.com/products"
severity: medium
tags: [навигация, категория, фильтр, automationexercise]

steps:
  - step: "Убедиться, что страница Products отображает секцию «CATEGORY» в левой боковой панели"
    expected: "Левая панель показывает заголовок «CATEGORY» с пунктами Women, Men и Kids"

  - step: "Нажать «Women» в боковой панели категорий, чтобы раскрыть подкатегории"
    expected: "Категория Women раскрывается и показывает подкатегории: Dress, Tops, Saree"

  - step: "Нажать «Tops» в подкатегориях Women"
    expected: "Страница фильтруется и показывает только товары Women > Tops"

  - step: "Проверить, что заголовок страницы отражает выбранную категорию"
    expected: "Заголовок страницы «WOMEN - TOPS PRODUCTS»"

  - step: "Убедиться, что в отфильтрованных результатах видны хотя бы две карточки товаров"
    expected: "Отображаются две и более карточки товаров, относящихся к категории Women Tops"
