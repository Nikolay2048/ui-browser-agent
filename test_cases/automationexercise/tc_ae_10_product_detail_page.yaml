id: tc_ae_10
name: "Страница товара — просмотр информации и добавление в корзину"
description: >
  Открытие страницы детальной информации о товаре должно показывать полную информацию
  о нём и позволять изменить количество перед добавлением в корзину.
start_url: "https://automationexercise.com/products"
severity: medium
tags: [товары, детальная-страница, pdp, automationexercise]

steps:
  - step: "Убедиться, что страница ALL PRODUCTS отображается с карточками товаров"
    expected: "Страница содержит заголовок «ALL PRODUCTS» и хотя бы одну карточку товара со ссылкой «View Product»"

  - step: "Нажать «View Product» на первом товаре в списке"
    expected: "Открывается страница детальной информации о товаре с его названием в заголовке"

  - step: "Убедиться, что на странице товара отображается цена"
    expected: "Цена товара видна в формате «Rs. XXX»"

  - step: "Проверить, что на странице указаны Availability, Condition и Brand"
    expected: "Страница показывает «Availability: In Stock», «Condition: New» и название бренда"

  - step: "Изменить количество на 3 с помощью поля ввода количества"
    expected: "В поле количества отображается значение 3"

  - step: "Нажать кнопку «Add to cart» на странице товара"
    expected: "Появляется модальное окно с подтверждением, что товар добавлен в корзину"
