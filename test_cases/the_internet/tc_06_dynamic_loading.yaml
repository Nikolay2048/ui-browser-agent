id: tc_06
name: "Динамическая загрузка — ожидание скрытого элемента"
description: >
  Проверить, что нажатие Start запускает спиннер загрузки, который исчезает
  и открывает динамически загруженный контент.
start_url: "https://the-internet.herokuapp.com/dynamic_loading/2"
severity: medium
tags: [динамический-контент, ожидание, the-internet, async]

steps:
  - step: "Убедиться, что страница отображает заголовок и кнопку Start"
    expected: "Страница содержит заголовок «Dynamically Loaded Page Elements» и кнопку Start"

  - step: "Нажать кнопку Start"
    expected: "На странице появляется индикатор загрузки (спиннер)"

  - step: "Подождать, пока спиннер загрузки исчезнет (до 10 секунд)"
    expected: "Индикатор загрузки исчезает в течение 10 секунд"

  - step: "Проверить динамически отображённый текст на странице"
    expected: "Текст «Hello World!» виден там, где находился скрытый элемент"
