id: tc_08
name: "Заблокированный пользователь не может войти"
description: >
  Проверить, что аккаунт 'locked_out_user' получает специфическое сообщение
  об ошибке и не может войти — демонстрация контроля доступа для заблокированных аккаунтов.
start_url: "https://www.saucedemo.com/"
severity: high
tags: [авторизация, негативный, заблокированный-пользователь, контроль-доступа, saucedemo]

steps:
  - step: "Убедиться, что форма входа отображается"
    expected: "Страница входа содержит поля Username, Password и кнопку Login"

  - step: "Ввести 'locked_out_user' как имя пользователя и 'secret_sauce' как пароль"
    expected: "Оба поля заполнены введёнными значениями"

  - step: "Нажать кнопку Login"
    expected: "Авторизация отклонена — страница остаётся на экране входа"

  - step: "Проверить, что сообщение об ошибке указывает на блокировку аккаунта"
    expected: "Красный баннер с текстом «Epic sadface: Sorry, this user has been locked out.»"
