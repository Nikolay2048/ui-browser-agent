id: tc_01
name: "Успешный вход — стандартный пользователь"
description: >
  Пользователь с корректными учётными данными может войти в систему
  и попасть на страницу каталога товаров.
start_url: "https://www.saucedemo.com/"
severity: critical
tags: [авторизация, smoke, вход, saucedemo]

steps:
  - step: "Проверить, что страница входа отображается с полями «Имя пользователя», «Пароль» и кнопкой «Login»"
    expected: "Форма входа полностью видна: поле Username, поле Password, кнопка Login"

  - step: "Ввести 'standard_user' в поле имени пользователя и 'secret_sauce' в поле пароля"
    expected: "Оба поля заполнены введёнными значениями"

  - step: "Нажать кнопку Login"
    expected: "Пользователь перенаправлен на страницу /inventory.html"

  - step: "Убедиться, что страница Products отображается с сеткой товаров"
    expected: "Страница содержит заголовок «Products» и не менее 6 карточек товаров с названиями и ценами"
