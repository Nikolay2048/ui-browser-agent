id: tc_06
name: "Problem User — сортировка товаров не работает"
description: >
  Для пользователя problem_user сортировка по цене не переупорядочивает товары:
  после выбора «Price (low to high)» самый дешёвый товар НЕ оказывается первым.
  Ожидается, что observer зафиксирует это как баг сайта.
start_url: "https://www.saucedemo.com/"
severity: high
tags: [баг, problem-user, сортировка, функциональный, saucedemo]

steps:
  - step: "Войти под 'problem_user' с паролем 'secret_sauce'"
    expected: "Пользователь на странице Products /inventory.html"

  - step: "Запомнить название первого товара в текущем порядке (до сортировки)"
    expected: "Первый товар в списке виден и его название зафиксировано"

  - step: "Открыть выпадающий список сортировки и выбрать «Price (low to high)»"
    expected: "В выпадающем списке выбрана опция «Price (low to high)»"

  - step: "Проверить, что первым в отсортированном списке стоит «Sauce Labs Onesie» за $7.99 — самый дешёвый товар"
    expected: "Первый товар в списке — «Sauce Labs Onesie» по цене $7.99. Порядок товаров изменился по возрастанию цены."

  - step: "Выбрать сортировку «Name (Z to A)» и убедиться, что первым идёт товар на букву T или S в обратном алфавитном порядке"
    expected: "Список переупорядочен в обратном алфавитном порядке: первым должен быть «Test.allTheThings() T-Shirt (Red)»"
