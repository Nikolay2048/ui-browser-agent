id: tc_03
name: "Добавление товара в корзину"
description: >
  Авторизованный пользователь может добавить товар в корзину, счётчик
  на иконке корзины обновляется, а на странице корзины отображается верный товар.
start_url: "https://www.saucedemo.com/"
severity: critical
tags: [корзина, e-commerce, smoke, saucedemo]

steps:
  - step: "Войти в систему под 'standard_user' / 'secret_sauce'"
    expected: "Пользователь находится на странице каталога товаров"

  - step: "Убедиться, что на странице отображаются карточки товаров с кнопками «Add to cart»"
    expected: "Видна хотя бы одна карточка товара с кнопкой Add to cart"

  - step: "Нажать «Add to cart» на товаре Sauce Labs Backpack"
    expected: "Кнопка меняется на «Remove», счётчик на иконке корзины в правом верхнем углу показывает «1»"

  - step: "Кликнуть иконку корзины в правом верхнем углу"
    expected: "Открывается страница корзины /cart.html"

  - step: "Убедиться, что в корзине находится «Sauce Labs Backpack» по цене $29.99"
    expected: "В корзине отображается «Sauce Labs Backpack», количество 1, цена $29.99"
