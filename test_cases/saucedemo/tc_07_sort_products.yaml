id: tc_07
name: "Сортировка товаров по цене (от низкой к высокой)"
description: >
  Проверить, что выбор опции «Price (low to high)» в выпадающем списке
  сортировки переупорядочивает товары так, что самый дешёвый оказывается первым.
start_url: "https://www.saucedemo.com/"
severity: medium
tags: [сортировка, товары, ui, saucedemo]

steps:
  - step: "Войти как 'standard_user' / 'secret_sauce' и убедиться, что отображается страница Products"
    expected: "Загружена страница Products с сеткой товаров и выпадающим списком сортировки в правом верхнем углу"

  - step: "Открыть выпадающий список сортировки и выбрать опцию «Price (low to high)»"
    expected: "В списке отображается «Price (low to high)», порядок товаров изменился"

  - step: "Убедиться, что самый дешёвый товар «Sauce Labs Onesie» с ценой «$7.99» присутствует на странице после сортировки"
    expected: "На странице видны текст 'Sauce Labs Onesie' и цена '$7.99'"

  - step: "Убедиться, что самый дорогой товар «Sauce Labs Fleece Jacket» с ценой «$49.99» присутствует на странице"
    expected: "На странице видны текст 'Sauce Labs Fleece Jacket' и цена '$49.99'"
