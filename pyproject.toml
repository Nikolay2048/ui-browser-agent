[project]
name = "browser-testing-agent"
version = "0.1.0"
description = "Educational LangGraph browser testing agent"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3",
    "langchain-ollama>=1.0",
    "langgraph>=1.2",
    "playwright>=1.50",
    "pydantic>=2.10",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
