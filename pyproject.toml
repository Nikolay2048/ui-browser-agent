[project]
name = "browser-testing-agent"
version = "0.2.0"
description = "AI-powered website testing agent using LangGraph + Playwright"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3",
    "langchain-ollama>=1.0",
    "langgraph>=1.2",
    "langsmith>=0.8",
    "playwright>=1.50",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "allure-pytest>=2.13",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-playwright>=0.5",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["generated_tests"]
addopts = "--alluredir=allure-results -ra"
